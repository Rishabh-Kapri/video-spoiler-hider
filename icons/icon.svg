  <rect x="7" y="7" width="114" height="114" rx="28" fill="url(#bg)"/>
  <rect x="10" y="10" width="108" height="108" rx="25" fill="none" stroke="#ffffff" stroke-opacity=".13" stroke-width="4"/>

  <path
    d="M22 64c9.5-18.5 24-28 42-28s32.5 9.5 42 28c-9.5 18.5-24 28-42 28S31.5 82.5 22 64Z"
