  <path
    d="M28 64c8.3-14.6 20.4-22 36-22s27.7 7.4 36 22c-8.3 14.6-20.4 22-36 22s-27.7-7.4-36-22Z"
    fill="none"
    stroke="url(#eye)"
    stroke-width="9"
    stroke-linejoin="round"
  />
  <circle cx="64" cy="64" r="18" fill="#111827"/>
  <path d="M58 52.5v23L78 64 58 52.5Z" fill="url(#play)"/>

  <rect x="32" y="81" width="64" height="14" rx="7" fill="#0b1220"/>
  <rect x="37" y="85" width="54" height="6" rx="3" fill="url(#mask)"/>
