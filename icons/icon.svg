<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Video Spoiler Hider icon</title>
  <desc id="desc">An eye-shaped mark with a play triangle and hidden progress line.</desc>
  <defs>
    <linearGradient id="bg" x1="18" y1="14" x2="110" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="eye" x1="27" y1="37" x2="101" y2="91" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="play" x1="53" y1="49" x2="82" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="mask" x1="34" y1="86" x2="94" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fb7185"/>
